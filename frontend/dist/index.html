    <script>
      // Apply the saved theme (or the OS preference) before first paint so there is
      // no flash of the wrong theme. Mirrors stores/themeStore.ts + hooks/useThemeSync.ts.
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('civitasone-theme') || 'null')
          var theme = saved && saved.state && saved.state.theme
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
