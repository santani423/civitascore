<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mekanisme Semester Pendek</title>
<script src="timeline.js"></script>
<style>
:root{
  --primary:#166534;--p50:#ecfdf3;--success:#166534;--warning:#ca8a04;--danger:#dc2626;
  --bg:#f8fafc;--surface:#fff;--hover:#f1f5f9;--border:#e2e8f0;--border-s:#cbd5e1;
  --ink1:#0f172a;--ink2:#475569;--ink3:#94a3b8;--amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b1220;font-family:"Segoe UI",-apple-system,Inter,Roboto,sans-serif;color:var(--ink1)}
#frame{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(1200px 600px at 80% -10%,#dcefe2 0,#eef3f0 45%,#e9eef3 100%)}
#top{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;background:rgba(255,255,255,.85);border-bottom:1px solid var(--border)}
#top img{width:34px;height:34px;object-fit:contain}
#top .brand{font-weight:700;font-size:18px}
#top .sub{color:var(--ink2);font-size:15px;padding-left:12px;border-left:1px solid var(--border-s)}
#draft{margin-left:auto;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:999px;letter-spacing:.02em}
#chip{background:var(--primary);color:#fff;font-weight:600;font-size:15px;padding:7px 14px;border-radius:999px}
#stage{position:absolute;left:0;top:64px;width:1280px;height:556px}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
#cap{position:absolute;left:0;right:0;bottom:0;height:100px;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:0 60px}
#capText{color:#fff;font-size:24px;line-height:1.35;text-align:center;font-weight:500}
#prog{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.08)}
#prog i{display:block;height:100%;background:#4ade80;width:0}
#cur{position:absolute;width:0;height:0;pointer-events:none;opacity:0;z-index:60}
#cur svg{position:absolute;left:-4px;top:-3px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
#cur .rip{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:3px solid #22c55e;opacity:0}
.hl{position:absolute;border:3px solid #f59e0b;border-radius:10px;opacity:0;pointer-events:none;z-index:20;box-shadow:0 0 0 4px rgba(245,158,11,.18)}
.ic{width:1em;height:1em;flex-shrink:0;vertical-align:-.125em}

/* ===== generic presentation ===== */
.row{display:flex;align-items:center}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}
.h1{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.lead{font-size:19px;color:var(--ink2);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-s);border-radius:999px;padding:9px 16px;font-weight:600;font-size:17px}
.ttl{position:absolute;left:50px;top:16px;font-size:28px;font-weight:800;letter-spacing:-.01em}
.ttl span{color:var(--primary)}
.box{position:absolute;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 6px 18px rgba(15,23,42,.06);transition:none}
.glow{box-shadow:0 0 0 3px var(--amber),0 12px 28px rgba(15,23,42,.12)!important}
.dim{opacity:.38!important}
.k{font-family:Consolas,"Cascadia Mono",monospace;font-size:.86em;background:#f1f5f9;border-radius:5px;padding:1px 6px;color:#334155}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:12.5px;font-weight:700;padding:3px 10px;white-space:nowrap}
.t-n{background:#f1f5f9;color:#475569}.t-s{background:#dcfce7;color:#166534}.t-w{background:#fef3c7;color:#a16207}.t-d{background:#fee2e2;color:#b91c1c}.t-i{background:#dbeafe;color:#1d4ed8}.t-p{background:#f3e8ff;color:#7e22ce}
.ok{color:#16a34a;font-weight:800}.no{color:#dc2626;font-weight:800}
.bx-h{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.bx-p{font-size:14.5px;color:var(--ink2);line-height:1.45}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:999px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;padding:0 8px}
svg.ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.nd{position:absolute;border-radius:14px;background:#fff;border:2px solid var(--border-s);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 10px;opacity:0;box-shadow:0 6px 16px rgba(15,23,42,.06)}
.nd b{font-size:17px}.nd small{font-size:12.5px;color:var(--ink2);line-height:1.3;margin-top:2px}
.nd.q{border-style:dashed;background:#fffbeb;border-color:#f59e0b}
ul.li{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.li li{font-size:14.5px;color:var(--ink2);line-height:1.35;position:relative;padding-left:16px}
ul.li li::before{content:"•";position:absolute;left:2px;top:0;color:var(--primary);font-weight:800}
.mono{font-family:Consolas,"Cascadia Mono",monospace}

/* status colors */
.st-draft{--c:#475569;--cb:#f1f5f9}.st-planned{--c:#1d4ed8;--cb:#dbeafe}.st-open{--c:#15803d;--cb:#dcfce7}.st-closed{--c:#b45309;--cb:#fef3c7}
.st-ongoing{--c:#4338ca;--cb:#e0e7ff}.st-grading{--c:#7e22ce;--cb:#f3e8ff}.st-completed{--c:#047857;--cb:#d1fae5}.st-archived{--c:#334155;--cb:#e2e8f0}
.sn{position:absolute;width:250px;height:76px;border-radius:14px;background:var(--cb);border:2px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
.sn b{font-family:Consolas,monospace;font-size:16px;color:var(--c);letter-spacing:.02em}
.sn span{font-size:14px;color:var(--ink2);margin-top:2px;font-weight:600}
.sn i{position:absolute;right:-9px;top:-9px;width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;font-style:normal;font-size:14px;font-weight:800;display:none;align-items:center;justify-content:center}
.sn.done i{display:flex}
.sn.act{transform:scale(1.07);box-shadow:0 0 0 4px var(--amber),0 12px 26px rgba(15,23,42,.15)}

/* apa */
.tlbar{position:absolute;left:60px;right:60px;top:84px;display:flex;gap:8px}
.seg{height:70px;border-radius:12px;background:#fff;border:1px solid var(--border-s);display:flex;flex-direction:column;justify-content:center;padding:0 14px;opacity:0}
.seg b{font-size:17px}.seg span{font-size:13.5px;color:var(--ink2)}
.seg.sp{background:#166534;border-color:#166534;color:#fff}.seg.sp span{color:#dcfce7}
.seg.nx{border-style:dashed;background:transparent}
.fact{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex:1;opacity:0}
.fact .e{font-size:28px}.fact b{font-size:17px;display:block}.fact span{font-size:14px;color:var(--ink2)}
.goal{flex:1;background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 14px;text-align:center;opacity:0;box-shadow:0 6px 18px rgba(15,23,42,.05)}
.goal .e{font-size:34px;line-height:1.1}.goal b{display:block;font-size:16.5px;margin-top:8px;line-height:1.3}

/* tree */
.tn{position:absolute;background:#fff;border:2px solid var(--border-s);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
.tn b{font-size:16px}.tn small{font-size:12px;color:var(--ink3);font-family:Consolas,monospace}
.tn.sp{border-color:#166534;background:#ecfdf3}.tn.sp b{color:#166534}
.ghost{position:absolute;font-size:12.5px;color:var(--ink3);text-align:center;line-height:1.4;opacity:0}
.strike{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#dc2626;color:var(--ink2)}

/* roles */
.role{position:absolute;top:150px;width:226px;height:290px;padding:16px;display:flex;flex-direction:column;gap:8px;opacity:0}
.role .av{font-size:36px}.role h4{font-size:18px;line-height:1.2}.role .k{font-size:11px;align-self:flex-start}
.role ul.li li{font-size:14px}

/* detail panel */
.dp{position:absolute;left:65px;right:65px;top:350px;height:176px;padding:16px 22px;display:flex;gap:22px}
.dp .dh{width:250px;flex-shrink:0;border-right:1px solid var(--border);padding-right:18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.dp .dh b{font-family:Consolas,monospace;font-size:18px;color:var(--c)}
.dp .dh span{font-size:22px;font-weight:800}
.dp .cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-content:center}
.dp .cols h5{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:5px}
.dp .cols p{font-size:14.5px;line-height:1.42;color:var(--ink1)}

/* forms */
.fcol{position:absolute;top:78px;width:375px;height:350px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;opacity:0}
.fcol h4{font-size:18px;display:flex;gap:9px;align-items:center}
.fr{display:flex;flex-direction:column;gap:3px}
.fr label{font-size:12px;color:var(--ink3);font-weight:600}
.fr .in{border:1px solid var(--border-s);border-radius:8px;height:32px;padding:0 10px;display:flex;align-items:center;font-size:14px;background:#fff;white-space:nowrap;overflow:hidden}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#14532d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:5px 9px;opacity:0}
.chk.bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}

/* settings tiles */
.set{position:absolute;width:368px;height:118px;padding:13px 16px;display:flex;flex-direction:column;gap:3px;opacity:0}
.set .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.set .t .e{font-size:20px}
.set .v{font-size:25px;font-weight:800;color:var(--primary);margin-top:2px}
.set .v small{font-size:12.5px;font-weight:600;color:var(--ink3);margin-left:6px}
.set .kk{font-family:Consolas,monospace;font-size:11.5px;color:var(--ink3);margin-top:auto}
.set .sc{position:absolute;right:12px;top:12px}
.tg{display:inline-flex;width:40px;height:22px;border-radius:999px;background:#16a34a;position:relative;vertical-align:middle}
.tg::after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.tg.off{background:#cbd5e1}.tg.off::after{right:auto;left:3px}

/* checks */
.ck12{position:absolute;width:187px;height:74px;border-radius:12px;background:#fff;border:2px solid var(--border-s);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;opacity:0}
.ck12 .r1{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;line-height:1.2}
.ck12 .r1 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#e2e8f0;color:#475569;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck12 small{font-family:Consolas,monospace;font-size:10.5px;color:var(--ink3);padding-left:29px}
.ck12.pass{border-color:#22c55e;background:#f0fdf4}.ck12.pass .r1 i{background:#16a34a;color:#fff}
.ck12.fail{border-color:#dc2626;background:#fef2f2}.ck12.fail .r1 i{background:#dc2626;color:#fff}
.ban{position:absolute;left:50px;right:50px;top:266px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:700;opacity:0}
.ban.g{background:#dcfce7;color:#14532d;border:1px solid #86efac}.ban.r{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}

/* grade chips */
.gch{display:inline-flex;width:44px;height:36px;border-radius:9px;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0}
.gch.y{background:#dcfce7;color:#166534;border-color:#86efac}
.gch.cur{box-shadow:0 0 0 3px #dc2626}

/* sks units */
.units{display:flex;gap:5px;position:relative}
.unit{width:38px;height:40px;border-radius:7px;border:1.5px dashed #cbd5e1;background:#fff}
.unit.e{background:#166534;border:0}.unit.p{background:#f59e0b;border:0}.unit.n{background:#2563eb;border:0}.unit.x{background:#dc2626;border:0}
.lim{position:absolute;top:-10px;bottom:-10px;width:0;border-left:3px solid #0f172a}
.lim span{position:absolute;top:-22px;left:-30px;font-size:12px;font-weight:700;white-space:nowrap}
table.tt{width:100%;border-collapse:collapse;font-size:14.5px}
table.tt th{font-size:12.5px;color:var(--ink2);text-align:left;font-weight:600;background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--border)}
table.tt td{padding:9px 10px;border-bottom:1px solid var(--border)}
table.tt tr:last-child td{border-bottom:0}
table.tt tr.hi td{background:#fffbeb}

/* ===== browser + app mock (portal) ===== */
.split{position:absolute;inset:0;display:flex;align-items:center;gap:28px;padding:0 30px}
.side{flex:1;position:relative;height:440px}
.sidecard{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.sidecard .n{display:inline-flex;min-width:32px;height:32px;padding:0 9px;border-radius:999px;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin-bottom:10px}
.sidecard h3{font-size:22px;line-height:1.25;margin-bottom:8px}
.sidecard p{font-size:16px;line-height:1.5;color:var(--ink2)}
.sidecard .warn{margin-top:12px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;line-height:1.4}
.sidecard .good{margin-top:12px;background:#dcfce7;border:1px solid #86efac;color:#14532d;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;line-height:1.4}
.browser{width:830px;height:536px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.18);overflow:hidden;border:1px solid var(--border-s);flex-shrink:0;position:relative}
.bbar{height:36px;background:#e9edf2;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--border-s)}
.bbar i{width:11px;height:11px;border-radius:50%;display:block}
.bbar .url{margin-left:14px;flex:1;background:#fff;border-radius:7px;height:23px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.bbar .ill{font-size:11px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:6px;padding:3px 8px}
.bcontent{position:absolute;top:36px;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.bcontent .inner{width:1038px;height:625px;transform:scale(.8);transform-origin:0 0;position:relative;overflow:hidden}
.app{position:absolute;inset:0;background:var(--bg);font-size:13.5px;color:var(--ink1)}
.sb{position:absolute;left:0;top:0;bottom:0;width:210px;background:#fff;border-right:1px solid var(--border);overflow:hidden}
.sb .lg{height:54px;display:flex;align-items:center;gap:9px;padding:0 15px;border-bottom:1px solid var(--border);font-weight:700;font-size:14.5px}
.sb .lg img{width:32px;height:32px;object-fit:contain}
.sb nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:13px;white-space:nowrap}
.ni.act{background:var(--p50);color:var(--primary);font-weight:600}
.ni .nb{margin-left:auto;font-size:10px;background:#166534;color:#fff;border-radius:999px;padding:1px 7px}
.subm{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 22px;border-left:1px solid var(--border);padding-left:7px}
.subm div{padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.subm div.act{background:var(--p50);color:var(--primary);font-weight:600}
.mn{position:absolute;top:0;right:0;bottom:0;left:210px}
.hd{height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.who{line-height:1.25}.who b{display:block;font-size:12.5px}.who span{font-size:11px;color:var(--ink3)}
.ct0{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden}
.scr{position:relative;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.bc{font-size:11.5px;color:var(--ink3)}
.ph1{font-size:20px;font-weight:700}
.strip{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink2)}
.strip b{color:var(--ink1)}
.bd{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-size:11px;font-weight:600;padding:2px 9px;white-space:nowrap}
.bd.n{background:#f1f5f9;color:var(--ink2)}.bd.s{background:#dcfce7;color:#166534}.bd.w{background:#fef3c7;color:#a16207}.bd.i{background:#dbeafe;color:#1d4ed8}.bd.d{background:#fee2e2;color:#b91c1c}
.pg{display:grid;grid-template-columns:1fr 262px;gap:14px;align-items:start}
.cc{background:#fff;border:1px solid var(--border);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.cc .r{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.cc .r b{color:var(--ink1);font-size:14px}
.cc .r .mono{font-size:12px;color:var(--ink1);font-weight:700}
.cc.off{background:#f8fafc;opacity:.62}
.cc .why{font-size:12px;color:#b91c1c;font-weight:600}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b.p{background:var(--primary);color:#fff}.b.o{background:#fff;border-color:var(--border-s);color:var(--ink1)}.b.dis{opacity:.45}.b.sel{background:#dcfce7;color:#166534;border-color:#86efac}
.b.red{background:#dc2626;color:#fff}
.cart{background:#fff;border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.cart h4{font-size:14px}
.cart .it{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding-bottom:6px}
.bar{height:9px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;background:#166534}
.mbg{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:60px;z-index:20}
.mdl{background:#fff;border-radius:14px;box-shadow:0 25px 60px rgba(0,0,0,.3);overflow:hidden;width:470px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);font-size:15px}
.mb{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.al{border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.45}
.al.i{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.tst{position:absolute;right:18px;bottom:18px;background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* seats */
.seats{display:grid;grid-template-columns:repeat(10,26px);gap:6px}
.seat{width:26px;height:26px;border-radius:6px;background:#166534}
.seat.f{background:#fff;border:2px dashed #94a3b8}
.seat.n{background:#22c55e;box-shadow:0 0 0 3px #bbf7d0}
.seat.x{background:#dc2626;box-shadow:0 0 0 3px #fecaca}
.stu{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:700}
.stu .a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#e0e7ff}

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const P=(lt,s,d=.5)=>ease(clamp((lt-s)/d));

const FRAME=document.getElementById('frame'),STAGE=document.getElementById('stage'),CUR=document.getElementById('cur');
function fade(el,p,dy=18,dx=0){if(!el)return;el.style.opacity=p;el.style.transform=p>=1?'none':`translate(${(1-p)*dx}px,${(1-p)*dy}px)`;}
function relRect(el,root){const a=el.getBoundingClientRect(),b=root.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};}
const R=(root,k)=>root.querySelector('[data-r="'+k+'"]');

const AA=(root,k)=>[...root.querySelectorAll('[data-a="'+k+'"]')];
function setHTML(el,html){if(el&&el.__h!==html){el.innerHTML=html;el.__h=html;}}
function setTxt(el,t){if(el&&el.textContent!==t)el.textContent=t;}
function hl(root,key,el,p,pad=5){
  let h=root.querySelector('.hl[data-k="'+key+'"]');
  if(!h){h=document.createElement('div');h.className='hl';h.dataset.k=key;root.appendChild(h);}
  if(!el||p<=0){h.style.opacity=0;return;}
  const r=relRect(el,root);
  Object.assign(h.style,{left:r.x-pad+'px',top:r.y-pad+'px',width:r.w+pad*2+'px',height:r.h+pad*2+'px',opacity:p});
}
const win=(lt,a,b)=>lt>=a&&lt<b?P(lt,a,.3):0;
function cueIdx(lt,c){let i=-1;c.forEach((s,k)=>{if(lt>=s-.05)i=k});return i;}
const glow=(el,on)=>{if(el)el.classList.toggle('glow',!!on);};

// svg-overlay items (paths / labels) tagged data-k
function sk(root,k,p){root.querySelectorAll('[data-k="'+k+'"]').forEach(e=>e.style.opacity=p);}
const COL={g:'#94a3b8',k:'#475569',s:'#16a34a',d:'#dc2626',w:'#d97706',b:'#2563eb'};
const defs=id=>`<defs>${Object.entries(COL).map(([k,c])=>`<marker id="${id}-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs>`;
const pth=(id,k,d,c='k',o={})=>`<path data-k="${k}" d="${d}" fill="none" stroke="${COL[c]}" stroke-width="${o.w||2.6}" ${o.dash?'stroke-dasharray="8 6"':''} ${o.noarrow?'':`marker-end="url(#${id}-${c})"`} style="opacity:0"/>`;
const txt=(k,x,y,t,c='k',o={})=>`<text data-k="${k}" x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.fs||13.5}" font-weight="700" fill="${COL[c]}" font-family="Segoe UI,sans-serif" style="opacity:0">${t}</text>`;
const svg=(id,inner,w=1280,h=556)=>`<svg class="ov" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${defs(id)}${inner}</svg>`;
// mouse cursor: list of [element|null, clickTime]
function cursor(root,lt,list){
  const cache=root.__cc||(root.__cc={});
  const pts=list.map(([el,t],i)=>{if(el){const r=relRect(el,FRAME);cache[i]={x:r.x+r.w/2,y:r.y+r.h/2};}return cache[i]?{...cache[i],t}:null;});
  let ni=list.findIndex(x=>x[1]>lt);
  const prev=ni===-1?pts[pts.length-1]:(ni>0?pts[ni-1]:null);
  const next=ni===-1?null:pts[ni];
  let x,y,op=0;
  if(next&&prev&&next.t-prev.t<=2.6){
    const s=Math.max(prev.t+.08,next.t-.8),d=Math.max(.05,Math.min(.6,next.t-.08-s));
    const g=P(lt,s,d);x=prev.x+(next.x-prev.x)*g;y=prev.y+(next.y-prev.y)*g;op=1;
  }else if(prev&&lt<prev.t+.75){x=prev.x;y=prev.y;op=1-P(lt,prev.t+.4,.35);}
  else if(next){const pIn=P(lt,next.t-.85,.6);x=next.x+(1-pIn)*70;y=next.y+(1-pIn)*80;op=pIn;}
  if(x==null){CUR.style.opacity=0;return;}
  CUR.style.left=x+'px';CUR.style.top=y+'px';CUR.style.opacity=op;
  const rip=CUR.querySelector('.rip');
  if(prev&&lt>=prev.t&&lt<prev.t+.5){const rp=(lt-prev.t)/.5;rip.style.opacity=1-rp;rip.style.transform=`scale(${.5+rp*1.1})`;}else rip.style.opacity=0;

  const cards=[...side.children];let act=-1;
  items.forEach((it,k)=>{if(it&&lt>=c[k]-.05)act=k});

  });
}
function qrSvg(size,seed0=7){

  const finder=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;const d=Math.max(Math.abs(x-3),Math.abs(y-3));m[Y][X]=d!==2&&d!==4;}};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  return `<svg width="${size}" height="${size}" viewBox="-2 -2 29 29" style="background:#fff;display:block"><g fill="#0f172a">${r}</g></svg>`;

// point along polyline at progress g (0..1)
function along(pts,g){

  let s=g*tot;for(let i=0;i<L.length;i++){if(s<=L[i]||i===L.length-1){const f=L[i]?clamp(s/L[i]):1;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f];}s-=L[i];}
  return pts[pts.length-1];
}

  <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">${['Pendaftaran','Kelas','Nilai','Keuangan','Ringkasan'].map((t,i)=>`<div data-a="rp${i}" style="display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14.5px;opacity:0"><b>${t}</b><span class="tag t-n" style="margin-left:auto;font-size:11.5px">CSV</span><span class="tag t-n" style="font-size:11.5px">PDF</span></div>`).join('')}</div>
  <p class="bx-p" style="font-size:13px;margin-top:12px">Filter periode wajib, prodi opsional. Setiap ekspor tercatat di audit log.</p></div>`,
 f(lt,c,r,e){fade(A(r,'ttl'),P(lt,0,.4));fade(A(r,'D'),P(lt,.2,.45),12);
  A(r,'st').style.boxShadow=lt>=c[1]&&lt<c[2]?'0 0 0 3px #f59e0b':'none';
  const L=Math.max(4,e[2]-c[2]-.5);[0,1,2,3,4].forEach(i=>A(r,'x'+i).style.background=lt>=c[2]+i*L/5&&lt<c[2]+(i+1)*L/5?'#fef3c7':'');
  fade(A(r,'RP'),P(lt,c[3],.45),0,24);[0,1,2,3,4].forEach(i=>fade(A(r,'rp'+i),P(lt,c[3]+.5+i*.6,.35),0,12));}};

/* 23 · rencana */
const PH=[['0','Prasyarat umum','akun dosen · dosen↔kelas · label periode',50,80],['1','Periode & penawaran','status · kelas · jadwal · pengaturan',50,170],['2','Penilaian & transkrip','status nilai · revisi · IPK efektif',50,260],
 ['3','KRS mandiri & persetujuan','kelayakan · approval · portal',400,170],['4','Pembayaran','tagihan · catat bayar · kedaluwarsa',700,170],['6','Dashboard · laporan · notifikasi','',980,110],['7','Mobile (opsional)','',980,230],['5','Prasyarat MK (opsional)','kapan saja setelah Fase 1',400,280]];
S.rencana={html:`${ttl('Rencana <span>implementasi</span>')}
 ${svg('ren',`${pth('ren','a0','M310 117 C350 117 360 200 398 205','g')}${pth('ren','a1','M310 207 L398 207','g')}${pth('ren','a2','M310 297 C350 297 360 214 398 209','g')}
  ${pth('ren','a3','M660 207 L698 207','g')}${pth('ren','a4','M960 200 C970 180 960 150 978 147','g')}${pth('ren','a5','M960 214 C970 234 960 262 978 267','g')}`)}
 ${PH.map((p,i)=>`<div class="box ph" data-a="p${i}" style="left:${p[3]}px;top:${p[4]}px;${p[0]==='5'?'border-style:dashed;':''}"><div class="t"><span class="num" style="min-width:24px;height:24px;font-size:12.5px">${p[0]}</span>${p[1]}</div>${p[2]?`<small>${p[2]}</small>`:''}</div>`).join('')}
 <div class="box" data-a="NB" style="left:50px;top:380px;width:1180px;height:128px;padding:14px 18px;opacity:0"><div class="bx-h" style="font-size:16px">🚫 Sengaja tidak dibangun</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${['Tabel khusus SP (short_*)','Tabel tahun akademik','Tabel penawaran kelas','Payment gateway · VA · QRIS','Daftar tunggu kelas penuh','Lebih dari 1 SP per tahun','LMS khusus SP','Komponen nilai berbobot khusus SP','WebSocket'].map((t,i)=>`<span class="tag t-n strike" data-a="nb${i}" style="font-size:14px;padding:5px 12px;opacity:0">${t}</span>`).join('')}</div></div>`,
 f(lt,c,r){fade(A(r,'ttl'),P(lt,0,.4));
  PH.forEach((_,i)=>fade(A(r,'p'+i),P(lt,.3+i*.25,.4),12));for(let i=0;i<6;i++)sk(r,'a'+i,P(lt,1+i*.25,.3));
  const a=cueIdx(lt,c);const L=[[],[0],[1,2,3,4],[7,5,6],[]][Math.max(0,a)]||[];
  let on=L;if(a===2){const k=Math.max(0,Math.min(3,Math.floor((lt-c[2])/2)));on=[[1],[2],[3],[4]][k];}
  PH.forEach((_,i)=>glow(A(r,'p'+i),on.includes(i)));
  fade(A(r,'NB'),P(lt,c[4],.45),12);for(let i=0;i<9;i++)fade(A(r,'nb'+i),P(lt,c[4]+.5+i*.45,.3),6);}};

/* 24 · ringkasan */
const SUM=[['📅','<b>Periode</b> berjenis pendek · 8 status · dikendalikan Bagian Akademik · aturan dari pengaturan kampus'],
 ['✅','<b>Pendaftaran</b>: 12 pemeriksaan → pending → persetujuan → tagihan → enrolled'],
 ['📝','<b>Perkuliahan &amp; nilai</b>: absensi &amp; ujian reuse · draft → submitted → finalized · IPK satu percobaan per MK']];
S.ringkasan={html:`${ttl('Ringkasan')}
 <div style="position:absolute;left:90px;right:90px;top:90px;display:flex;flex-direction:column;gap:16px">${SUM.map((s,i)=>`<div class="check" data-a="s${i}"><span class="b2">${i+1}</span><span class="e">${s[0]}</span><span>${s[1]}</span></div>`).join('')}</div>
 <div data-a="fin" style="position:absolute;inset:0;background:linear-gradient(135deg,#166534,#14532d);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;opacity:0">
  <img src="logo-atmajaya.gif" style="width:84px;height:84px;object-fit:contain;background:#fff;border-radius:50%;padding:8px">
  <div style="font-size:42px;font-weight:800">Terima kasih</div>
  <div style="font-size:19px;opacity:.92">Rincian lengkap: <span class="mono" style="background:rgba(255,255,255,.15);padding:3px 10px;border-radius:7px">docs/semester-pendek/</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:980px;margin-top:6px">${['README','aturan-bisnis','peran-dan-izin','desain-database','desain-api','penilaian-dan-transkrip','pembayaran-dan-notifikasi','frontend-dan-mobile','keamanan-audit-integritas','pengujian-dan-penerimaan','rencana-implementasi'].map(t=>`<span class="mono" style="font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px">${t}.md</span>`).join('')}</div>
  <div style="font-size:14px;opacity:.75;margin-top:6px">Rancangan — fitur belum diterapkan</div></div>`,
 f(lt,c,r){fade(A(r,'ttl'),P(lt,0,.4));[1,2,3].forEach((k,i)=>fade(A(r,'s'+i),P(lt,c[k]-.1,.45),0,-30));A(r,'fin').style.opacity=P(lt,c[4]-.2,.6);}};

// ---------- engine ----------
const roots={};
TL.scenes.forEach(s=>{const d=document.createElement('section');d.className='scene';d.innerHTML=S[s.id].html;STAGE.appendChild(d);roots[s.id]=d;});
const CAP=document.getElementById('capText'),CHIP=document.getElementById('chip'),PROG=document.querySelector('#prog i');
let cur=null;
window.render=function(t){
  const n=TL.scenes.length;let k=TL.scenes.findIndex(s=>t>=s.start&&t<s.start+s.dur);if(k<0)k=n-1;
  const sc=TL.scenes[k],lt=t-sc.start,root=roots[sc.id];
  if(cur!==root){if(cur){cur.style.visibility='hidden';cur.style.opacity=0;}root.style.visibility='visible';cur=root;}
  root.style.opacity=k===0?P(lt,0,.6):P(lt,0,.45);
  CUR.style.opacity=0;
  const c=sc.lines.map(l=>l.start-sc.start),e=sc.lines.map(l=>l.end-sc.start);
  S[sc.id].f(lt,c,root,e);
  let li=-1;sc.lines.forEach((l,i)=>{if(t>=l.start-.12)li=i});
  const txt=li>=0?sc.lines[li].cap:'';if(CAP.textContent!==txt)CAP.textContent=txt;
  CAP.style.opacity=li>=0?P(t,sc.lines[li].start-.12,.2):0;
  CHIP.textContent=k===0?'Rancangan Fitur':`Bagian ${k}/${n-1} · ${sc.title}`;
  PROG.style.width=(t/TL.total*100)+'%';
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
const q=new URLSearchParams(location.search);
if(q.has('t'))ready.then(()=>render(+q.get('t')));
else if(q.has('play')){const t0=performance.now()-(+q.get('play')||0)*1000;const loop=()=>{render((performance.now()-t0)/1000%TL.total);requestAnimationFrame(loop)};ready.then(loop);}
</script>
</body>
