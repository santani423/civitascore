<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tutorial Manajemen Ujian Dosen</title>
<script src="timeline.js"></script>
<style>
:root{
  --primary:#166534;--primary-h:#114f29;--p50:#ecfdf3;--success:#166534;--warning:#ca8a04;--danger:#dc2626;
  --bg:#f8fafc;--surface:#fff;--hover:#f1f5f9;--border:#e2e8f0;--border-s:#cbd5e1;
  --ink1:#0f172a;--ink2:#475569;--ink3:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b1220;font-family:"Segoe UI",-apple-system,Inter,Roboto,sans-serif;color:var(--ink1)}
#frame{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(1200px 600px at 80% -10%,#dcefe2 0,#eef3f0 45%,#e9eef3 100%)}
#top{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;background:rgba(255,255,255,.85);border-bottom:1px solid var(--border)}
#top img{width:34px;height:34px;object-fit:contain}
#top .brand{font-weight:700;font-size:18px}
#top .sub{color:var(--ink2);font-size:15px;padding-left:12px;border-left:1px solid var(--border-s)}
#chip{margin-left:auto;background:var(--primary);color:#fff;font-weight:600;font-size:15px;padding:7px 14px;border-radius:999px}
#stage{position:absolute;left:0;top:64px;width:1280px;height:556px}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
#cap{position:absolute;left:0;right:0;bottom:0;height:100px;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:0 60px}
#capText{color:#fff;font-size:24px;line-height:1.35;text-align:center;font-weight:500}
#prog{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.08)}
#prog i{display:block;height:100%;background:#4ade80;width:0}
#cur{position:absolute;width:0;height:0;pointer-events:none;opacity:0;z-index:60}
#cur svg{position:absolute;left:-4px;top:-3px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
#cur .rip{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:3px solid #22c55e;opacity:0}
.hl{position:absolute;border:3px solid #f59e0b;border-radius:10px;opacity:0;pointer-events:none;z-index:20;box-shadow:0 0 0 4px rgba(245,158,11,.18)}

/* generic */
.row{display:flex;align-items:center}.between{justify-content:space-between}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}
.h1{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:30px;font-weight:800;letter-spacing:-.01em}
.lead{font-size:19px;color:var(--ink2);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-s);border-radius:999px;padding:9px 16px;font-weight:600;font-size:17px}
.ic{width:1em;height:1em;flex-shrink:0;vertical-align:-.125em}

/* split layout */
.split{position:absolute;inset:0;display:flex;align-items:center;gap:28px;padding:0 30px}
.side{flex:1;position:relative;height:440px}
.sidecard{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px 24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.sidecard .n{display:inline-flex;min-width:32px;height:32px;padding:0 9px;border-radius:999px;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin-bottom:10px}
.sidecard h3{font-size:22px;line-height:1.25;margin-bottom:8px}
.sidecard p{font-size:16px;line-height:1.5;color:var(--ink2)}
.sidecard .warn{margin-top:12px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;line-height:1.4}
.sidecard .bad{margin-top:12px;background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;line-height:1.4}
.sidecard .good{margin-top:8px;background:#dcfce7;border:1px solid #86efac;color:#14532d;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600}
.sidecard .bd{font-size:13px;padding:3px 9px}
.mini{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.mini td{padding:5px 8px;border-bottom:1px solid var(--border)}
.mini td:first-child{font-weight:700;width:60px}

/* browser */
.browser{width:830px;height:536px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.18);overflow:hidden;border:1px solid var(--border-s);flex-shrink:0;position:relative}
.bbar{height:36px;background:#e9edf2;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--border-s)}
.bbar i{width:11px;height:11px;border-radius:50%;display:block}
.bbar .url{margin-left:14px;flex:1;background:#fff;border-radius:7px;height:23px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.bcontent{position:absolute;top:36px;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.bcontent .inner{width:1038px;height:625px;transform:scale(.8);transform-origin:0 0;position:relative;overflow:hidden}

/* ===== app (dashboard dosen) ===== */
.app{position:absolute;inset:0;background:var(--bg);font-size:13.5px;color:var(--ink1)}
.sb{position:absolute;left:0;top:0;bottom:0;background:#fff;border-right:1px solid var(--border);overflow:hidden}
.sb.full{width:224px}.sb.mini{width:64px}
.sb .lg{height:54px;display:flex;align-items:center;gap:9px;padding:0 15px;border-bottom:1px solid var(--border);font-weight:700;font-size:14.5px}
.sb .lg img{width:32px;height:32px;object-fit:contain}
.sb nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;font-size:13px;white-space:nowrap}
.ni .ic{width:17px;height:17px}.ni .cv{margin-left:auto;width:13px;height:13px}
.ni.act{background:var(--p50);color:var(--primary)}
.sb.mini .ni{justify-content:center;padding:10px 0}
.subm{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 26px;border-left:1px solid var(--border);padding-left:7px}
.subm div{padding:6px 10px;border-radius:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.subm div.act{background:var(--p50);color:var(--primary);font-weight:600}
.mn{position:absolute;top:0;right:0;bottom:0}
.sb.full+.mn{left:224px}.sb.mini+.mn{left:64px}
.hd{height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;height:32px;padding:0 10px;width:250px;color:var(--ink3);font-size:12.5px;background:var(--bg)}
.srch kbd{margin-left:auto;font-family:inherit;font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:#fff}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:16px;color:var(--ink2)}
.hd .rt .ic{width:17px;height:17px}
.av{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.who{line-height:1.25}.who b{display:block;font-size:12.5px;color:var(--ink1)}.who span{font-size:11px;color:var(--ink3)}
.ct0{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden}
.scr{position:relative;padding:18px 22px 80px;display:flex;flex-direction:column;gap:16px}
.phd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.phd .bc{font-size:11.5px;color:var(--ink3);margin-bottom:4px}
.phd h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.phd p{font-size:12.5px;color:var(--ink2);margin-top:2px}
.acts{display:flex;gap:8px;flex-shrink:0}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b.p{background:var(--primary);color:#fff}
.b.o{background:#fff;border-color:var(--border-s);color:var(--ink1)}
.b.g{color:var(--ink2);background:transparent;padding:0 7px}
.b.sm{height:28px;padding:0 10px;font-size:12px}
.b.dis{opacity:.45}
.b .ic{width:14px;height:14px}
.cd{background:#fff;border:1px solid var(--border);border-radius:12px}
.cdh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 0}
.cd .ct{font-weight:600;font-size:14.5px;display:flex;align-items:center}
.cdd{font-size:12px;color:var(--ink3);margin-top:2px}
.cdb{padding:12px 16px 16px}
.cdt{margin-top:12px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{background:var(--bg);color:var(--ink2);font-weight:600;text-align:left;padding:8px 11px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:11.5px;white-space:nowrap}
.tb td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.new td{background:#f0fdf4}
.tb .empty{text-align:center;color:var(--ink3);padding:22px}
.lc2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-size:11px;font-weight:600;padding:2px 9px;white-space:nowrap}
.bd.n{background:#f1f5f9;color:var(--ink2)}.bd.s{background:#dcfce7;color:#166534}.bd.w{background:#fef3c7;color:#a16207}.bd.i{background:#dbeafe;color:#1d4ed8}
.al{border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.al.i{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.al.d{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.al.w{background:#fefce8;border:1px solid #fde68a;color:#854d0e}
.al .x{margin-left:auto;opacity:.6}
.fld .lb{font-size:12.5px;font-weight:500;margin-bottom:5px}
.in{position:relative;border:1px solid var(--border-s);border-radius:8px;height:34px;padding:0 10px;display:flex;align-items:center;font-size:12.5px;background:#fff;gap:6px;white-space:nowrap}
.in.f{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.15)}
.in .ph{color:var(--ink3)}
.in.ta{height:auto;min-height:62px;align-items:flex-start;padding:8px 10px;line-height:1.45;white-space:normal}
.in.sel>.ic{margin-left:auto;color:var(--ink3);width:14px;height:14px}
.in.dis{background:var(--hover);color:var(--ink3)}
.in.mono{font-family:Consolas,monospace;font-size:11.5px;overflow:hidden}
.hint{font-size:11px;color:var(--ink3);margin-top:4px}
.dd{position:absolute;left:-1px;right:-1px;top:37px;background:#fff;border:1px solid var(--border-s);border-radius:8px;box-shadow:0 10px 25px rgba(15,23,42,.18);z-index:5;padding:4px}
.dd div{padding:7px 9px;border-radius:6px;font-size:12.5px}
.dd div.hi{background:var(--p50);color:var(--primary);font-weight:600}
.ck{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.ck i{width:16px;height:16px;border-radius:4px;border:1px solid var(--border-s);display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0;color:#fff}
.ck i svg{width:12px;height:12px}
.ck.on i{background:var(--primary);border-color:var(--primary)}
.rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-s);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.rd.on{border-color:var(--primary)}.rd.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--ink1);margin-left:-5px}
.mbg{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:26px;z-index:20}
.mdl{background:#fff;border-radius:14px;box-shadow:0 25px 60px rgba(0,0,0,.3);overflow:hidden;position:relative}
.mh{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);font-size:15px}
.mx{color:var(--ink3);font-size:20px;line-height:1}
.mvp{position:relative;overflow:hidden}
.mb{padding:15px 18px;display:flex;flex-direction:column;gap:12px}
.mft{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.tst{position:absolute;right:18px;bottom:18px;background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tst .ic{color:#4ade80;width:15px;height:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 16px;font-size:12.5px}
.g4 .k,.g3 .k{color:var(--ink3);font-size:11.5px}.g4 .v,.g3 .v{font-weight:600;margin-top:2px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;font-size:12.5px;border:1px solid var(--border-s);border-radius:9px;padding:11px}
.tiles6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tl{border:1px solid var(--border-s);border-radius:9px;padding:10px 6px;text-align:center}
.tl b{display:block;font-size:17px}.tl span{font-size:11px;color:var(--ink3)}
.tl.s{border-color:rgba(22,101,52,.4);background:rgba(22,101,52,.05)}.tl.s b{color:var(--success)}
.tl.w{border-color:rgba(202,138,4,.4);background:rgba(202,138,4,.06)}.tl.w b{color:var(--warning)}
.tl.p{border-color:rgba(22,101,52,.4);background:rgba(22,101,52,.05)}.tl.p b{color:var(--primary)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--primary);margin-left:9px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--primary);display:block}
.vio{display:inline-flex;align-items:center;gap:4px;color:var(--danger);font-weight:700}
.lnk{color:var(--primary);font-weight:600}
.fb{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3);margin-top:3px}
.fb .ic{width:11px;height:11px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--border-s);border-radius:9px;padding:10px 10px 4px}
.prow{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px}
.prow:last-child{border-bottom:0}
.prow small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.vl{border:1px solid rgba(220,38,38,.3);background:rgba(220,38,38,.05);border-radius:9px;padding:9px 11px}
.vl .row b{font-size:12.5px}.vl p{font-size:12.5px;color:var(--ink2)}.vl small{font-size:11px;color:var(--ink3)}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat span{font-size:12px;color:var(--ink3)}.stat b{display:block;font-size:24px;margin-top:4px}
.login{position:absolute;inset:0;background:linear-gradient(135deg,#f0fdf4,#f8fafc 60%);display:flex;align-items:center;justify-content:center}
.lcard{width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 20px 50px rgba(15,23,42,.08);display:flex;flex-direction:column;gap:14px}

/* full-stage scenes */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.step{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(15,23,42,.05);position:relative}
.step .no{position:absolute;right:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.step .e{font-size:30px;line-height:1}.step h4{font-size:19px}.step p{font-size:14.5px;color:var(--ink2);line-height:1.4}
.mcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:10px}
.mcard h4{font-size:19px;display:flex;align-items:center;gap:9px}
.mcard h4 span{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.mcard p{font-size:14.5px;color:var(--ink2);line-height:1.4}
.pool{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pool i{height:28px;border-radius:6px;border:1px solid var(--border-s);font-style:normal;font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;background:#fff}
.pool i.on{background:rgba(22,101,52,.12);border-color:rgba(22,101,52,.45);color:var(--primary)}
.pool i.a{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.pool i.b{background:#fce7f3;border-color:#f9a8d4;color:#be185d}
.who2{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.who2 b{width:52px;flex-shrink:0;color:var(--ink1)}
.who2 i{font-style:normal;width:20px;height:20px;border-radius:5px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.who2 i.a{background:#dbeafe;color:#1d4ed8}.who2 i.b{background:#fce7f3;color:#be185d}.who2 i.on{background:rgba(22,101,52,.12);color:var(--primary)}
.mlist{border:1px solid var(--border);border-radius:9px;overflow:hidden;font-size:12.5px}
.mlist div{display:flex;align-items:center;gap:9px;padding:6px 9px;border-bottom:1px solid var(--border)}
.mlist div:last-child{border-bottom:0}.mlist .hdr{background:var(--bg);font-weight:600;color:var(--ink2);font-size:11.5px}
.ex{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;flex:1}
.ex .t{font-size:12.5px;color:var(--ink3);font-weight:600}.ex .q{font-size:14px;font-weight:600;margin:4px 0 8px}
.ex .o{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ex .o span{border:1px solid var(--border-s);border-radius:7px;padding:4px 8px;font-size:12.5px;color:var(--ink2)}
.fcard{flex:1;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px rgba(15,23,42,.05);text-align:center;align-items:center}
.fcard .no{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.fcard h4{font-size:22px}.fcard .en{font-size:13px;color:var(--ink3);margin-top:-6px}
.fcard .fx{background:var(--hover);border-radius:10px;padding:12px 10px;font-size:17px;font-weight:600;width:100%;line-height:1.35}
.exv{background:#0f172a;color:#fff;border-radius:12px;padding:13px;text-align:center;font-size:22px;font-weight:700;width:100%}
.exv small{display:block;font-size:12px;font-weight:500;opacity:.7;margin-bottom:2px}
.vcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.vcard .e{font-size:28px}.vcard h4{font-size:17.5px}.vcard p{font-size:14px;color:var(--ink2);line-height:1.4}
.vcard .pen{position:absolute;right:14px;top:14px;background:#fee2e2;color:#b91c1c;font-weight:700;font-size:14px;border-radius:999px;padding:4px 10px}
.tipcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.tipcard .e{font-size:28px}.tipcard h4{font-size:18px}.tipcard p{font-size:15px;color:var(--ink2)}
.check{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px;font-size:17px;line-height:1.3}
.check .b2{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:15px}

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const P=(lt,s,d=.5)=>ease(clamp((lt-s)/d));
const typed=(str,lt,t0,dur)=>str.slice(0,Math.round(str.length*clamp((lt-t0)/dur)));
const FRAME=document.getElementById('frame'),STAGE=document.getElementById('stage'),CUR=document.getElementById('cur');
function fade(el,p,dy=18,dx=0){if(!el)return;el.style.opacity=p;el.style.transform=`translate(${(1-p)*dx}px,${(1-p)*dy}px)`;}
function relRect(el,root){const a=el.getBoundingClientRect(),b=root.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};}
const R=(root,k)=>root.querySelector('[data-r="'+k+'"]');
function setHTML(el,html){if(el.__h!==html){el.innerHTML=html;el.__h=html;}}
function hl(root,key,el,p,pad=5){
  let h=root.querySelector('.hl[data-k="'+key+'"]');
  if(!h){h=document.createElement('div');h.className='hl';h.dataset.k=key;root.appendChild(h);}
  if(!el||p<=0){h.style.opacity=0;return;}
  const r=relRect(el,root);
  Object.assign(h.style,{left:r.x-pad+'px',top:r.y-pad+'px',width:r.w+pad*2+'px',height:r.h+pad*2+'px',opacity:p});
}
const win=(lt,a,b)=>lt>=a&&lt<b?P(lt,a,.3):0;
function cueIdx(lt,c){let i=-1;c.forEach((s,k)=>{if(lt>=s-.05)i=k});return i;}
// mouse cursor: list of [element|null, clickTime]; glides between close clicks
function cursor(root,lt,list){
  const cache=root.__cc||(root.__cc={});
  const pts=list.map(([el,t],i)=>{if(el){const r=relRect(el,FRAME);cache[i]={x:r.x+r.w/2,y:r.y+r.h/2};}return cache[i]?{...cache[i],t}:null;});
  let ni=list.findIndex(x=>x[1]>lt);
  const prev=ni===-1?pts[pts.length-1]:(ni>0?pts[ni-1]:null);
  const next=ni===-1?null:pts[ni];
  let x,y,op=0;
  if(next&&prev&&next.t-prev.t<=2.6){
    const s=Math.max(prev.t+.08,next.t-.8),d=Math.max(.05,Math.min(.6,next.t-.08-s));
    const g=P(lt,s,d);x=prev.x+(next.x-prev.x)*g;y=prev.y+(next.y-prev.y)*g;op=1;
  }else if(prev&&lt<prev.t+.75){x=prev.x;y=prev.y;op=1-P(lt,prev.t+.4,.35);}
  else if(next){const pIn=P(lt,next.t-.85,.6);x=next.x+(1-pIn)*70;y=next.y+(1-pIn)*80;op=pIn;}
  if(x==null){CUR.style.opacity=0;return;}
  CUR.style.left=x+'px';CUR.style.top=y+'px';CUR.style.opacity=op;
  const rip=CUR.querySelector('.rip');
  if(prev&&lt>=prev.t&&lt<prev.t+.5){const rp=(lt-prev.t)/.5;rip.style.opacity=1-rp;rip.style.transform=`scale(${.5+rp*1.1})`;}else rip.style.opacity=0;
  CUR.querySelector('svg').style.transform=prev&&lt>=prev.t&&lt<prev.t+.15?'scale(.85)':'none';
}
function sideCards(root,lt,c,items){
  const side=root.querySelector('.side');
  if(!side.dataset.b){side.innerHTML=items.map(it=>it?`<div class="sidecard">${it.n?`<span class="n">${it.n}</span>`:''}<h3>${it.t}</h3>${it.b?`<p>${it.b}</p>`:''}${it.x||''}</div>`:'<div class="sidecard" style="display:none"></div>').join('');side.dataset.b=1;}
  const cards=[...side.children];let act=-1;
  items.forEach((it,k)=>{if(it&&lt>=c[k]-.05)act=k});
  cards.forEach((el,k)=>{
    if(k!==act){el.style.opacity=0;return;}
    const p=P(lt,c[k]-.05,.45);el.style.opacity=p;el.style.transform=`translateY(calc(-50% + ${(1-p)*20}px))`;
  });
}
function qrSvg(size,seed0=7){
  let seed=seed0;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=25,m=[];for(let y=0;y<n;y++){m.push([]);for(let x=0;x<n;x++)m[y].push(rnd()<.5);}
  const finder=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;const d=Math.max(Math.abs(x-3),Math.abs(y-3));m[Y][X]=d!==2&&d!==4;}};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  return `<svg width="${size}" height="${size}" viewBox="-2 -2 29 29" style="background:#fff;display:block"><g fill="#0f172a">${r}</g></svg>`;
}
// scroll the app content: steps [[t,y],...] (first = initial)
function scrollSeq(lt,steps){let y=steps[0][1];for(let k=1;k<steps.length;k++)y+=(steps[k][1]-y)*P(lt,steps[k][0],.6);return y;}
function offY(el,cont){let y=0;while(el&&el!==cont){y+=el.offsetTop;el=el.offsetParent;}return y;}
function scrollTo(root,y){
  const s=root.querySelector('.scr');if(!s)return;
  const max=Math.max(0,s.offsetHeight-s.parentElement.clientHeight);
  s.style.transform=`translateY(${-clamp(y,0,max)}px)`;
}
const anchor=(root,k,pad=14)=>{const el=R(root,k),s=root.querySelector('.scr');return el&&s?offY(el,s)-pad:0;};
function toastFx(root,lt,t0,t1){const t=root.querySelector('.tst');if(!t)return;const p=P(lt,t0,.25)*(1-P(lt,t1-.3,.3));t.style.opacity=p;t.style.transform=`translateY(${(1-p)*12}px)`;}
function setURL(root,u){const el=R(root,'url');if(el&&el.textContent!==u)el.textContent=u;}

function liveStatus(lt,c){
  return i=>{
    const base=['in_progress','not_started','in_progress','in_progress','in_progress','in_progress','not_started','in_progress'][i];
    if(i===1&&lt>=c[2]+.7)return 'in_progress';
    if(i===4&&lt>=c[2]+2.2)return 'completed';
    if(i===5&&lt>=c[2]+3.5)return 'completed';
    return base;
  };
}

// ---------- engine ----------
const roots={};
TL.scenes.forEach(s=>{const d=document.createElement('section');d.className='scene';d.innerHTML=S[s.id].html;STAGE.appendChild(d);roots[s.id]=d;});
const CAP=document.getElementById('capText'),CHIP=document.getElementById('chip'),PROG=document.querySelector('#prog i');
let cur=null;
window.render=function(t){
  const n=TL.scenes.length;let k=TL.scenes.findIndex(s=>t>=s.start&&t<s.start+s.dur);if(k<0)k=n-1;
  const sc=TL.scenes[k],lt=t-sc.start,root=roots[sc.id];
  if(cur!==root){if(cur){cur.style.visibility='hidden';cur.style.opacity=0;}root.style.visibility='visible';cur=root;}
  root.style.opacity=k===0?P(lt,0,.6):P(lt,0,.45);
  CUR.style.opacity=0;
  const c=sc.lines.map(l=>l.start-sc.start);
  S[sc.id].f(lt,c,root,sc.dur);
  let li=-1;sc.lines.forEach((l,i)=>{if(t>=l.start-.12)li=i});
  const txt=li>=0?sc.lines[li].cap:'';if(CAP.textContent!==txt)CAP.textContent=txt;
  CAP.style.opacity=li>=0?P(t,sc.lines[li].start-.12,.2):0;
  CHIP.textContent=k===0?'Panduan Dosen':`Bagian ${k}/${n-1} · ${sc.title}`;
  PROG.style.width=(t/TL.total*100)+'%';
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
const q=new URLSearchParams(location.search);
if(q.has('t'))ready.then(()=>render(+q.get('t')));
else if(q.has('play')){const t0=performance.now()-(+q.get('play')||0)*1000;const loop=()=>{render((performance.now()-t0)/1000%TL.total);requestAnimationFrame(loop)};ready.then(loop);}
</script>
