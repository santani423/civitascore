<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tutorial Ujian Mahasiswa</title>
<script src="timeline.js"></script>
<style>
:root{
  --primary:#166534;--primary-h:#114f29;--success:#166534;--warning:#ca8a04;--danger:#dc2626;
  --bg:#f8fafc;--surface:#fff;--hover:#f1f5f9;--border:#e2e8f0;--border-s:#cbd5e1;
  --ink1:#0f172a;--ink2:#475569;--ink3:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0b1220;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink1)}
#frame{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(1200px 600px at 80% -10%,#dcefe2 0,#eef3f0 45%,#e9eef3 100%)}
#top{position:absolute;left:0;top:0;right:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;background:rgba(255,255,255,.85);border-bottom:1px solid var(--border)}
#top img{width:34px;height:34px;object-fit:contain}
#top .brand{font-weight:700;font-size:18px}
#top .sub{color:var(--ink2);font-size:15px;padding-left:12px;border-left:1px solid var(--border-s)}
#chip{margin-left:auto;background:var(--primary);color:#fff;font-weight:600;font-size:15px;padding:7px 14px;border-radius:999px}
#stage{position:absolute;left:0;top:64px;width:1280px;height:556px}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
#cap{position:absolute;left:0;right:0;bottom:0;height:100px;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:0 60px}
#capText{color:#fff;font-size:25px;line-height:1.35;text-align:center;font-weight:500}
#prog{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,.08)}
#prog i{display:block;height:100%;background:#4ade80;width:0}
#tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;opacity:0;z-index:50}
#tap .dot{position:absolute;inset:8px;border-radius:50%;background:rgba(15,23,42,.35);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#tap .rip{position:absolute;inset:0;border-radius:50%;border:3px solid #22c55e;opacity:0}
.hl{position:absolute;border:3px solid #f59e0b;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,23,42,.0);opacity:0;pointer-events:none;z-index:20}

/* generic */
.row{display:flex;align-items:center}.between{justify-content:space-between}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}
.h1{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:30px;font-weight:800;letter-spacing:-.01em}
.lead{font-size:19px;color:var(--ink2);line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-s);border-radius:999px;padding:9px 16px;font-weight:600;font-size:17px}
.ic{width:1em;height:1em;flex-shrink:0;vertical-align:-.125em}
.spin{animation:none}

/* split layout */
.split{position:absolute;inset:0;display:flex;align-items:center;gap:36px;padding:0 40px}
.side{flex:1;position:relative;height:420px}
.sidecard{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:#fff;border:1px solid var(--border);border-radius:18px;padding:26px 28px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.sidecard .n{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:12px}
.sidecard h3{font-size:24px;line-height:1.25;margin-bottom:10px}
.sidecard p{font-size:17px;line-height:1.5;color:var(--ink2)}
.sidecard .warn{margin-top:14px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 12px;font-size:15.5px;font-weight:600}
.sidecard .bad{margin-top:14px;background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:15.5px;font-weight:600}

/* browser */
.browser{width:800px;height:536px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.18);overflow:hidden;border:1px solid var(--border-s);flex-shrink:0;position:relative}
.bbar{height:36px;background:#e9edf2;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--border-s)}
.bbar i{width:11px;height:11px;border-radius:50%;display:block}
.bbar .url{margin-left:14px;flex:1;background:#fff;border-radius:7px;height:23px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;padding:0 10px}
.bcontent{position:absolute;top:36px;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.bcontent .inner{width:1000px;height:625px;transform:scale(.8);transform-origin:0 0;position:relative;overflow:hidden}

/* phone */
.phone{width:286px;height:560px;border-radius:40px;background:#0f172a;padding:10px;box-shadow:0 24px 50px rgba(15,23,42,.28);position:relative;flex-shrink:0}
.pscreen{position:absolute;inset:10px;border-radius:31px;overflow:hidden;background:var(--bg)}
.pstat{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:var(--ink1);background:#fff}
.purl{background:#fff;padding:4px 10px 8px;border-bottom:1px solid var(--border)}
.purl div{background:#eef1f5;border-radius:9px;font-size:11px;color:var(--ink2);padding:6px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pview{position:absolute;top:30px;left:0;right:0;bottom:0;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}

/* app (OneAtma public exam) */
.pbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.pbar .l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.pbar img{width:26px;height:26px;object-fit:contain}
.tog{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
.card .ct{font-weight:600;font-size:16px}.card .cd{font-size:13px;color:var(--ink3);margin:2px 0 14px}
.info{border:1px solid var(--border-s);background:var(--hover);border-radius:10px;padding:12px}
.info .tt{font-weight:600;font-size:15px}.info .cs{font-size:13px;color:var(--ink3)}
.info .mt{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:12.5px;color:var(--ink2)}
.info .mt span{display:flex;align-items:center;gap:5px}
.lbl{font-size:13px;font-weight:500;margin-bottom:5px;color:var(--ink1)}
.inp{border:1px solid var(--border-s);border-radius:9px;height:38px;padding:0 11px;display:flex;align-items:center;font-size:14px;background:#fff}
.inp.f{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,101,52,.18)}
.inp .ph{color:var(--ink3)}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--ink1);margin-left:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid transparent}
.btn.p{background:var(--primary);color:#fff}.btn.o{background:#fff;border-color:var(--border-s);color:var(--ink1)}
.btn.dis{opacity:.45}.btn.w{width:100%}
.alert{border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.alert.d{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.alert.w{background:#fefce8;border:1px solid #fde68a;color:#a16207}

/* exam page */
.ex{padding:16px 24px;display:flex;flex-direction:column;gap:12px;max-width:820px;margin:0 auto;user-select:none}
.exh{border:1px solid var(--border);border-radius:14px;background:rgba(248,250,252,.95);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.exh .t{font-weight:600;font-size:16px}.exh .s{font-size:12px;color:var(--ink3)}.exh .id{font-size:12px;color:var(--ink2);margin-top:4px}
.timer{display:flex;align-items:center;gap:6px;border:1px solid var(--border-s);border-radius:9px;padding:6px 12px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.timer.w{border-color:rgba(202,138,4,.4);background:rgba(202,138,4,.1);color:var(--warning)}
.timer.d{border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.1);color:var(--danger)}
.vb{display:flex;align-items:center;gap:5px;border:1px solid rgba(220,38,38,.4);background:rgba(220,38,38,.1);color:var(--danger);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.num{width:32px;height:32px;border-radius:9px;border:1px solid var(--border-s);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--ink2)}
.num.a{border-color:rgba(22,101,52,.4);background:rgba(22,101,52,.1);color:var(--success)}
.num.c{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary)}
.num.l{opacity:.4}
.cnt{font-size:12px;color:var(--ink3)}
.qn{font-size:13px;font-weight:500;color:var(--ink3)}
.sav{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:4px}
.qt{font-size:16px;font-weight:500;margin:12px 0 14px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--border-s);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink2);background:#fff}
.opt .r{width:16px;height:16px;border-radius:50%;border:1px solid var(--border-s);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.s{border-color:var(--primary);background:rgba(22,101,52,.05);color:var(--ink1)}
.opt.s .r{border-color:var(--primary);background:var(--primary)}.opt.s .r::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.modalbg{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:5}
.modal{background:#fff;border-radius:16px;width:440px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h4{font-size:17px;margin-bottom:14px}
.center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:380px;color:var(--ink3);font-size:14px;text-align:center}

/* phone-compact exam */
.phone .ex{padding:10px;gap:9px}
.phone .exh{padding:9px 10px;gap:7px;border-radius:12px}
.phone .exh .t{font-size:13px}.phone .exh .s,.phone .exh .id{font-size:10.5px}
.phone .timer{font-size:12.5px;padding:4px 7px;gap:4px}.phone .vb{font-size:11px;padding:4px 7px}
.phone .num{width:22px;height:22px;font-size:10px;border-radius:6px}.phone .nums{gap:4px}
.phone .cnt{font-size:10.5px}.phone .card{padding:11px;border-radius:12px}
.phone .qt{font-size:13px;margin:8px 0 10px}.phone .opt{padding:8px 9px;font-size:12px;gap:8px}
.phone .qn{font-size:11px}.phone .btn{height:32px;font-size:12px;padding:0 11px}.phone .alert{font-size:11px;padding:6px 8px}
.phone .card .ct{font-size:15px}

/* result */
.res{padding:20px 26px;display:flex;flex-direction:column;gap:14px}
.ph1{font-size:22px;font-weight:700}.ph2{font-size:13px;color:var(--ink3)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:13px}
.grid4 .k{color:var(--ink3)}.grid4 .v{font-weight:500;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tiles5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{border:1px solid var(--border-s);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;font-size:19px}.tile span{font-size:11.5px;color:var(--ink3)}
.tile.g{border-color:rgba(22,101,52,.4);background:rgba(22,101,52,.05)}.tile.g b{color:var(--success)}
.tile.r{border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.05)}.tile.r b{color:var(--danger)}
.tile.pr{border-color:rgba(22,101,52,.4);background:rgba(22,101,52,.05)}.tile.pr b{color:var(--primary)}
.hr{border-top:1px solid var(--border);margin:12px 0}
.kor{border-left:4px solid var(--success)}.kor.x{border-left-color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;font-size:11.5px;font-weight:600;padding:3px 9px}
.badge.g{background:rgba(22,101,52,.12);color:var(--success)}.badge.r{background:rgba(220,38,38,.12);color:var(--danger)}
.ko{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border-s);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink2);margin-top:6px}
.ko.g{border-color:rgba(22,101,52,.5);background:rgba(22,101,52,.1);color:var(--ink1)}
.ko.r{border-color:rgba(220,38,38,.5);background:rgba(220,38,38,.1);color:var(--ink1)}
.pemb{border:1px solid var(--border-s);background:var(--hover);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--ink2);margin-top:8px}
.toast{position:absolute;right:16px;top:12px;background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center;z-index:9}

/* misc scenes */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.feat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start;box-shadow:0 6px 18px rgba(15,23,42,.05)}
.feat .e{font-size:34px;line-height:1}
.feat h4{font-size:20px;margin-bottom:5px}.feat p{font-size:16px;color:var(--ink2);line-height:1.45}
.errrow{display:grid;grid-template-columns:430px 1fr;gap:18px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 16px}
.errrow .alert{font-size:15px;font-weight:600}
.errrow p{font-size:15.5px;color:var(--ink2);line-height:1.4}.errrow p b{color:var(--ink1)}
.vcard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.vcard .e{font-size:30px}.vcard h4{font-size:18px}.vcard p{font-size:14.5px;color:var(--ink2);line-height:1.4}
.vcard .pen{position:absolute;right:14px;top:14px;background:#fee2e2;color:#b91c1c;font-weight:700;font-size:14px;border-radius:999px;padding:4px 10px}
.chat{position:absolute;inset:0;background:#efe7dd;display:flex;flex-direction:column}
.chat .hd{background:#075e54;color:#fff;padding:9px 12px;display:flex;gap:9px;align-items:center}
.chat .av{width:30px;height:30px;border-radius:50%;background:#9fd4b4;display:flex;align-items:center;justify-content:center;font-size:13px;color:#064e3b;font-weight:700}
.chat .hd b{font-size:13px;display:block}.chat .hd small{font-size:10.5px;opacity:.8}
.msgs{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.msg{background:#fff;border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.4;max-width:88%;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg .who{font-size:11px;font-weight:700;color:#0e7490;margin-bottom:2px}
.msg.me{align-self:flex-end;background:#d9fdd3}
.msg a{color:#0369a1;text-decoration:underline;word-break:break-all}
.msg .tm{font-size:9.5px;color:#64748b;text-align:right;margin-top:2px}
.tipcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.tipcard .e{font-size:28px}.tipcard h4{font-size:18px}.tipcard p{font-size:15px;color:var(--ink2)}
.check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px;font-size:17px;line-height:1.35}
.check .b{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:15px}
.check .b.r{background:var(--danger)}
</style>
</head>
<body>
<div id="frame">
  <div id="top"><img src="logo-atmajaya.gif" alt=""><span class="brand">OneAtma</span><span class="sub">Tutorial Ujian Mahasiswa</span><span id="chip"></span></div>
  <div id="stage"></div>
  <div id="cap"><p id="capText"></p></div>
  <div id="prog"><i></i></div>
  <div id="tap"><div class="rip"></div><div class="dot"></div></div>
</div>
<script>
// ---------- icons ----------
const I = {
  clock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  user:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>',
  shield:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4M12 16h.01"/></svg>',
  tri:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg>',
  load:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>',
  dl:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5"/></svg>',
  ok:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  wifiOff:'<svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 12.86a10 10 0 0 1 5.17-2.69M2 2l20 20"/></svg>',
};
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const P=(lt,s,d=.5)=>ease(clamp((lt-s)/d));
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function fade(el,p,dy=18,dx=0){el.style.opacity=p;el.style.transform=`translate(${(1-p)*dx}px,${(1-p)*dy}px)`;}
const typed=(str,lt,t0,dur)=>str.slice(0,Math.round(str.length*clamp((lt-t0)/dur)));
const FRAME=document.getElementById('frame'),STAGE=document.getElementById('stage'),TAP=document.getElementById('tap');
function relRect(el,root){const a=el.getBoundingClientRect(),b=root.getBoundingClientRect();return{x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};}
function tap(el,lt,t0){
  if(!el||lt<t0-.8||lt>t0+.7)return;
  const r=relRect(el,FRAME);const pIn=P(lt,t0-.8,.55);
  TAP.style.left=(r.x+r.w/2+(1-pIn)*60)+'px';TAP.style.top=(r.y+r.h/2+(1-pIn)*70)+'px';
  TAP.style.opacity=Math.min(pIn,1-P(lt,t0+.35,.35));

function hl(root,key,el,p,pad=6){
  let h=root.querySelector('.hl[data-k="'+key+'"]');
  if(!h){h=document.createElement('div');h.className='hl';h.dataset.k=key;root.appendChild(h);}
  if(!el||p<=0){h.style.opacity=0;return;}
  const r=relRect(el,root);
  Object.assign(h.style,{left:r.x-pad+'px',top:r.y-pad+'px',width:r.w+pad*2+'px',height:r.h+pad*2+'px',opacity:p});

function cueIdx(lt,c){let i=-1;c.forEach((s,k)=>{if(lt>=s-.05)i=k});return i;}
function sideCards(root,lt,c,items){
  const side=root.querySelector('.side');
  if(!side.dataset.b){side.innerHTML=items.map(it=>it?`<div class="sidecard">${it.n?`<span class="n">${it.n}</span>`:''}<h3>${it.t}</h3>${it.b?`<p>${it.b}</p>`:''}${it.x||''}</div>`:'<div class="sidecard" style="display:none"></div>').join('');side.dataset.b=1;}
  const cards=[...side.children];let act=-1;
  items.forEach((it,k)=>{if(it&&lt>=c[k]-.05)act=k});
  cards.forEach((el,k)=>{
    if(k!==act){el.style.opacity=0;return;}

  });

function qrSvg(size){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=25,m=[];for(let y=0;y<n;y++){m.push([]);for(let x=0;x<n;x++)m[y].push(rnd()<.5);}
  const finder=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=n||Y>=n)continue;const d=Math.max(Math.abs(x-3),Math.abs(y-3));m[Y][X]=d!==2&&d!==4;}};
  finder(0,0);finder(n-7,0);finder(0,n-7);
  let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  return `<svg width="${size}" height="${size}" viewBox="-2 -2 29 29" style="background:#fff;display:block"><g fill="#0f172a">${r}</g></svg>`;
}

// ---------- engine ----------
const roots={};
TL.scenes.forEach(s=>{const d=document.createElement('section');d.className='scene';d.innerHTML=S[s.id].html;STAGE.appendChild(d);roots[s.id]=d;});
const CAP=document.getElementById('capText'),CHIP=document.getElementById('chip'),PROG=document.querySelector('#prog i');
let cur=null;
window.render=function(t){
  const n=TL.scenes.length;let k=TL.scenes.findIndex(s=>t>=s.start&&t<s.start+s.dur);if(k<0)k=n-1;
  const sc=TL.scenes[k],lt=t-sc.start,root=roots[sc.id];
  if(cur!==root){if(cur){cur.style.visibility='hidden';cur.style.opacity=0;}root.style.visibility='visible';cur=root;}
  root.style.opacity=k===0?P(lt,0,.6):P(lt,0,.45);
  TAP.style.opacity=0;
  const c=sc.lines.map(l=>l.start-sc.start);
  S[sc.id].f(lt,c,root,sc.dur);
  let li=-1;sc.lines.forEach((l,i)=>{if(t>=l.start-.12)li=i});
  const txt=li>=0?sc.lines[li].cap:'';if(CAP.textContent!==txt)CAP.textContent=txt;
  CAP.style.opacity=li>=0?P(t,sc.lines[li].start-.12,.2):0;
  CHIP.textContent=k===0?'Panduan':`Bagian ${k}/${n-1} · ${sc.title}`;
  PROG.style.width=(t/TL.total*100)+'%';
};
window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
const q=new URLSearchParams(location.search);
if(q.has('t'))ready.then(()=>render(+q.get('t')));
else if(q.has('play')){const t0=performance.now()-(+q.get('play')||0)*1000;const loop=()=>{render((performance.now()-t0)/1000%TL.total);requestAnimationFrame(loop)};ready.then(loop);}
</script>
</body>
</html>
